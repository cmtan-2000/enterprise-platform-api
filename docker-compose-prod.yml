name: enterprise-platform-prod

services:
  api:
    build:
      context: .
      dockerfile: EnterprisePlatform.Api/Dockerfile
    container_name: enterpriseplatform-api
    ports:
      - "5226:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=enterprise_platform;Username=postgres;Password=${POSTGRES_PASSWORD};Maximum Pool Size=5;Timeout=5"
      Redis__ConnectionString: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18
    container_name: enterprise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d enterpriseplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: enterprise-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
  prometheus:
      image: prom/prometheus:latest
      container_name: enterprise-prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
      depends_on:
        - api
      restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  redis:
    image: redis:7
    container_name: enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  grafana-data:
  redis_data:
  postgres_data: